name: deploy

# A SITE IS NOT AN APP.
#
# hanzoskills.com is 1081 flat files that never execute. It gets no image, no
# App CR and no reconcile — it goes to the Sites plane:
#
#   POST /v1/projects/hanzoskills/deployments   (202, a prefix-scoped upload grant)
#   POST the objects straight to S3             (the bytes skip the API)
#   POST .../deployments/<id>/complete          (live; prunes what the build dropped)
#
# The mechanics are NOT transcribed here; they are `bin/site` in hanzoai/ci,
# which hanzo.works, hanzo.ai and hips all call. The action self-provisions the
# project, so committing this file was enough to stand the site up.
#
# ONE credential, and it is a KMS read, not a Cloudflare token. Cloudflare is
# DNS and CDN for this host and nothing else — there is no account credential
# in this lane to expire, fail to fetch, or scope wrongly.

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/site.py'
      - 'scripts/marks.py'
      - 'scripts/webmcp.ts'
      - 'tests/site.mjs'
      - 'tests/discovery.py'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  # A superseded build is cancelled. The site flips live at the completion
  # POST, not while bytes are uploading, so a killed run leaves an incomplete
  # deployment that never became a Release — the live site is untouched. Held
  # false, a burst of pushes serialised into a train of full builds and the
  # newest commit waited behind builds of commits nobody wanted.
  group: deploy-hanzoskills
  cancel-in-progress: true

env:
  HOST: hanzoskills.com
  WWW: www.hanzoskills.com

jobs:
  deploy:
    runs-on: [linux-amd64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The chrome has one definition. If rendering it changes any page, the
      # committed site and its source have drifted.
      - name: public/ matches scripts/site.py
        run: |
          set -euo pipefail
          python3 scripts/site.py
          git diff --exit-code -- public/ \
            || { echo "::error::public/ is stale — run python3 scripts/site.py"; exit 1; }

      - name: the site is intact
        run: |
          set -euo pipefail
          test -s public/index.html
          grep -q '<title>Hanzo Skills</title>' public/index.html
          grep -q 'ai-train=yes' public/robots.txt
          ! grep -qE '^Disallow: /$' public/robots.txt
          for f in index.md llms.txt all.md favicon.svg skill.md sitemap.xml robots.txt webmcp.js; do
            test -s "public/$f"
          done
          # One collector, ours. A beacon script tag in the source HTML is a second one.
          ! grep -rEq --include='*.html' '<script[^>]*cloudflareinsights\.com' public/ || { echo "::error::beacon in source"; exit 1; }
          # Monochrome palette, aligned with hanzo.ai light and dark tokens.
          bad=$(grep -ohE '#[0-9a-fA-F]{6}' public/index.html public/favicon.svg | sort -fu \
                | grep -viE '^#(000000|ffffff|fafafa|f5f5f7|f4f4f2|e5e5e5|dddddd|d8d8d4|d4d4d4|a1a1a6|9c9c98|86868b|7a7a75|737378|6e6e73|6a6a66|525252|3a3a3a|262626|232323|181818|171717|141414|0f0f0f|0a0a0a)$' || true)
          [ -z "$bad" ] || { echo "::error::non-monochrome colour in the page: $bad"; exit 1; }

      # What an agent discovers the site by: /auth.md, the API catalog, the MCP
      # server card and the skills index, whose digests site.py derives from the
      # committed markdown.
      - name: the discovery documents are well formed
        run: python3 tests/discovery.py public

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The WebMCP tools every page loads are scripts/webmcp.ts with its types
      # stripped; the committed module must be exactly that.
      - name: public/webmcp.js matches scripts/webmcp.ts
        run: |
          set -euo pipefail
          npm run -s webmcp
          git diff --exit-code -- public/webmcp.js \
            || { echo "::error::public/webmcp.js is stale — run npm run webmcp"; exit 1; }

      # The gates run in the job that PUBLISHES. Workflows sharing a trigger do
      # not order themselves, so a red gate in ci.yml cannot stop a publish here.
      #
      # The runner image carries chromium for playwright 1.58.0 at
      # PLAYWRIGHT_BROWSERS_PATH=/opt/playwright (hanzoai/ci runner/Dockerfile),
      # so this pins that version and installs no browser. `playwright install`
      # locks the browsers directory with a mkdir before it checks anything, and
      # the job cannot write /opt/playwright: it fails even when the browser is
      # there, after minutes of retrying the lock. The runner has no working sudo
      # for --with-deps either.
      - name: browser checks
        run: |
          set -euo pipefail
          npm i --no-save playwright@1.58.0
          python3 -m http.server 8787 --bind 127.0.0.1 --directory public &
          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8787/; then break; fi
            sleep 1
          done
          node tests/site.mjs http://127.0.0.1:8787 shots

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: shots
          path: shots/

      - name: Publish to the Sites plane
        uses: hanzoai/ci/.github/actions/site@v1
        with:
          slug: hanzoskills
          dir: public
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}

      - name: the live host serves the new page
        # `grep <<<"$body"`, never `printf … | grep -q`. That pipeline is a race
        # the size of this page loses: grep -q exits on the FIRST match and
        # closes the pipe, printf takes SIGPIPE on the remaining ~180KB, and
        # pipefail promotes 141 to a step failure. It reports a healthy host as
        # a failed deploy — measured, exitcode 141, five minutes of retries
        # against a page that was correct on every attempt. A herestring is not
        # a pipeline, so there is nothing to signal.
        run: |
          set -euo pipefail
          body=""
          for i in $(seq 1 30); do
            body=$(curl -sS "https://$HOST/" || true)
            if grep -q 'id="copybtn"' <<<"$body"; then break; fi
            sleep 10
          done
          grep -q 'id="copybtn"' <<<"$body"
          grep -q 'class="mark"' <<<"$body"
          grep -q 'Drop into any agent' <<<"$body"
          curl -sfS -o /dev/null "https://$HOST/favicon.svg"
          curl -sfS -o /dev/null "https://$HOST/sitemap.xml"

      # A file in git is not a file being served: this host answered a managed
      # robots.txt naming no crawler while ours sat in the repo unread. Ask the
      # live host, on a site whose whole purpose is being read by agents.
      - name: crawlers are actually welcome
        run: |
          set -euo pipefail
          r=$(curl -sS "https://$HOST/robots.txt")
          grep -q 'ai-train=yes' <<<"$r" \
            || { echo "::error::the live robots.txt is not ours"; exit 1; }
          grep -q '^Allow: /' <<<"$r"
          grep -q '^User-agent: ClaudeBot' <<<"$r"

      - name: www resolves
        run: |
          set -euo pipefail
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://$WWW/" || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 10
          done
          [ "$code" = "200" ] || { echo "::error::$WWW returned $code"; exit 1; }

      # The markdown twins are half the corpus and the half agents fetch, so
      # they are checked for reach and content rather than assumed from the
      # html passing. Their Content-Type is the PLANE's to set and is asserted
      # nowhere here: staticFiles derives it from the key alone (objectInfo
      # carries no stored type), and for an extension outside Go's builtin
      # table it currently sends none at all — an ingress fix, not a site one.
      - name: the markdown twins are served
        run: |
          set -euo pipefail
          md=$(curl -sfS "https://$HOST/index.md")
          grep -q '^# Hanzo Skills' <<<"$md"
          curl -sfS -o /dev/null "https://$HOST/all.md"
          llms=$(curl -sfS "https://$HOST/llms.txt")
          grep -q 'hanzoskills.com' <<<"$llms"

      # Served, not just committed: each document answers 200 with the committed
      # bytes, and every skill's digest matches what the host serves for it.
      - name: the discovery documents are served
        run: |
          set -uo pipefail
          # The plane may answer from its object cache for a moment after the
          # completion; a document that stays wrong for two minutes is a failure.
          for i in $(seq 1 8); do
            python3 tests/discovery.py public "https://$HOST" && exit 0
            sleep 15
          done
          exit 1

      - name: the live host renders
        run: node tests/site.mjs "https://$HOST" shots-live

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: shots-live
          path: shots-live/
