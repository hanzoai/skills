name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One commit is one run. Keying on the ref cancels a build whenever the next
# push lands, which hides whether any given commit was ever green.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  catalogue:
    name: the catalogue parses
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install
        working-directory: pkg
        run: npm ci

      - name: Types
        working-directory: pkg
        run: npm run typecheck

      # The suite parses every SKILL.md this repo ships with the parser this
      # repo ships, so a skill that no agent could load fails here instead.
      - name: Test
        working-directory: pkg
        run: npm test
