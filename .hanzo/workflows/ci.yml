name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One commit is one run. Keying on the ref cancels a build whenever the next
# push lands, which hides whether any given commit was ever green.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  catalogue:
    name: every skill loads
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The parser lives once, in the tool. This repository holds skills, not a
      # second copy of the code that reads them — it asks the tool the same
      # question a loader would, and a skill no agent could load fails here.
      #
      # Fetched with a credential because the forge serves nothing anonymously:
      # a clone that works from a developer's machine works because that machine
      # is logged in, which says nothing about a runner.
      - name: Validate
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
        run: |
          if [ -z "${FORGE_TOKEN:-}" ]; then
            echo "::error::FORGE_TOKEN is unset, so the checker could not be fetched."
            exit 1
          fi
          git clone --quiet --depth 1 "https://x:${FORGE_TOKEN}@git.hanzo.ai/hanzoai/skill.git" /tmp/skill
          npm --prefix /tmp/skill ci --silent
          node /tmp/skill/dist/cli.js validate skills/
