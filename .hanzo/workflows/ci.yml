name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One commit is one run. Keying on the ref cancels a build whenever the next
# push lands, which hides whether any given commit was ever green.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: false

jobs:
  catalogue:
    name: every skill loads
    runs-on: [hanzo-build-linux-amd64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The parser lives once, in the tool. This repository holds skills, not a
      # second copy of the code that reads them — it asks the tool the same
      # question a loader would, and a skill no agent could load fails here.
      # --registry, not an .npmrc: npm only reads a directory's .npmrc when the
      # directory is a project, and this one has no package.json — it holds
      # skills, not a package. The version is pinned so a tool release cannot
      # change what this gate means without someone saying so here.
      - name: Validate
        run: npx --yes --registry=https://pkg.hanzo.ai/ @hanzo/skill@1.0.2 validate skills/
