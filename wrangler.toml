# hanzoskills.com — assets-only Worker, no build step.
#
# A Worker rather than a Pages project for the same reason hanzo.codes and
# hanzo.sh are: the account is at its Pages project limit. There is nothing to
# compile — public/ is the site, byte for byte, and what is in git is what a
# stranger gets.
#
# This host answers /llms.txt with `access-control-allow-origin: *` and a
# charset-suffixed content-type, which hanzo.codes does not — the signature of
# a Pages project. So deploy.yml asks the account which one holds the name and
# publishes that way; this file is what it uses when no Pages project does.
#
# Publishing is .hanzo/workflows/deploy.yml, which re-fetches the live host and
# fails unless the bytes it just published are the bytes being served.
name = "hanzoskills"
compatibility_date = "2026-07-01"

[assets]
directory = "public"

routes = [
  { pattern = "hanzoskills.com", custom_domain = true },
  { pattern = "www.hanzoskills.com", custom_domain = true }
]
