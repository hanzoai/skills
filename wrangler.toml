# hanzoskills.com — a Cloudflare Pages project, direct upload, no build step.
#
# Pages rather than a Worker because that is what already answers for this
# host: it returns `access-control-allow-origin: *` and a charset-suffixed
# content-type, which Workers Static Assets does not emit.
#
# public/ is the site, byte for byte, and what is in git is what a stranger
# gets. scripts/site.py owns the shared chrome across those files; CI runs it
# and fails if the tree moves, so the page and its source cannot drift.
#
# The project name is resolved from the live domain at deploy time rather than
# trusted from here, and www is added as a second custom domain on the project.
name = "hanzoskills"
compatibility_date = "2026-07-01"
pages_build_output_dir = "public"
